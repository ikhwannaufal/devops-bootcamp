<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Card — DevOps Bootcamp 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .card {
      width: 320px;
      padding: 2rem;
      text-align: center;
      border-radius: 24px;
      background: #1e293b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      animation: fade-in 0.9s ease-out both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      margin-bottom: 1.25rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .cohort {
      margin-top: 0.4rem;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .role {
      margin-top: 1rem;
      font-size: 1rem;
      font-weight: 500;
      color: #a5b4fc;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.5); }
      50%      { box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); }
    }
  </style>
</head>
<body>
  <article class="card">
    <span class="badge">DevOps Bootcamp</span>
    <h1 class="name">ikhwannaufal</h1>
    <p class="cohort">Cohort 2026</p>
    <p class="role">DevOps Engineer</p>
  </article>
</body>
</html>
